<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TuFeedUADY</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <main class="contenedor-login">
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Modo oscuro</button>
        <h1>TuFeedUADY</h1>
        <h2>Bienvenido!</h2>

        <form id="formLogin">
            <div class="grupo-campo">
                <label for="usuario">Correo o nickname:</label>
                <input type="text" id="usuario" name="usuario" autocomplete="username" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p id="mensaje-login" role="status" aria-live="polite"></p>
        <p class="enlace-registro">¿No tienes cuenta? <a href="preferences.html">Regístrate</a></p>
    </main>
    <script src="JS/login.js"></script>
    <script src="JS/tema.js"></script>
</body>
</html>
