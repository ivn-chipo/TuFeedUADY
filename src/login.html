<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TuFeedUADY</title>
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <main class="contenedor-login">
        <h1>TuFeedUADY</h1>
        <h2>Bienvenido!</h2>

        <form>
            <div class="grupo-campo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="tu-correo@example.com" required>
            </div>

            <div class="grupo-campo">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Tu contraseña" required>
            </div>

            <button type="button">Iniciar sesión</button>
        </form>

        <p class="enlace-registro">¿No tienes cuenta? <a href="preferences.html">Regístrate</a></p>
    </main>
</body>
</html>
