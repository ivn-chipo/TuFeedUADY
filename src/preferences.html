<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro UADY</title>
    <!--Vinculamos la hoja de estilos CSS-->
    <link rel="stylesheet" href="CSS/preferences.css">
</head>
<body>

    <div class="contenedor-login">
        <!-- 1ª Seccion: La bienvenida-->
        <h2>Bienvenido</h2>
        <p>Cuentanos sobre ti</p>

        <!--Formulario principal en donde se pedira: Nombre, Campus, Intereses y algun correo electronico -->
        <form id="formRegistro">
            
            <!-- Input para el nickname / usuario -->
            <div class="grupo-campo">
                <label for="nickname">Tu usuario o nickname:</label>
                <input type="text" id="nickname" name="nickname" placeholder="Ej. Victor123" required>
            </div>

            <!-- Seleccion de Campus UADY -->
            <div class="grupo-campo">
                <label>Vengo de:</label>
                <!-- Usamos botones de radio agrupados con el mismo "name" para que sea facil de usar y validar, 
                    asi el usuario solo puede elegir una opcion y nos parecio mas comodo para la interfaz -->
                <div class="opciones-campus">
                    <label><input type="radio" name="campus" value="CCEI" required> CCEI</label>
                    <label><input type="radio" name="campus" value="CAHAD"> CAHAD</label>
                    <label><input type="radio" name="campus" value="CCSE">CCSE</label>
                    <label><input type="radio" name="campus" value="Otros"> Algun otro campus UADY</label>
                </div>
            </div>

            <!-- Intereses (cambiaran de forma dinamica con JS mas adelante) -->
            <div class="grupo-campo" id="seccion-intereses">
                <label>¿Algun interes en particular?</label>
                <div id="contenedor-checkboxes">
                    <label><input type="checkbox" name="intereses[]" value="Videojuegos"> Videojuegos</label>
                    <label><input type="checkbox" name="intereses[]" value="Informatica"> Informatica</label>
                    <label><input type="checkbox" name="intereses[]" value="Quimica"> Quimica</label>
                    <label><input type="checkbox" name="intereses[]" value="Otros"> Otros</label>
                </div>
            </div>

            <!-- Input para el correo -->
            <div class="grupo-campo">
                <label for="correo">Danos un correo para linear tu perfil:</label>
                <input type="email" id="correo" name="correo" placeholder="example@example.com" required>
            </div>

            <!-- Boton de siguiente / enviar -->
            <button type="submit" id="btnSiguiente">Siguiente</button>

        </form>
        <p class="enlace-login">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <!-- Vinculamos nuestro archivo de JavaScript -->
    <script src="JS/preferences.js"></script>
</body>

</html>
