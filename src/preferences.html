<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | TuFeedUADY</title>
    <!--Vinculamos la hoja de estilos CSS-->
    <link rel="stylesheet" href="CSS/preferences.css">
</head>
<body>

    <div class="contenedor-login">
        <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">Modo oscuro</button>
        <!-- 1ª Seccion: La bienvenida-->
        <h2>Crear cuenta</h2>
        <p class="texto-intro">Cuéntanos sobre ti</p>

        <!-- Datos necesarios para crear la cuenta -->
        <form id="formRegistro">
            
            <div class="grupo-campo">
                <label for="nickname">Tu usuario o nickname:</label>
                <input type="text" id="nickname" name="nickname" autocomplete="username" minlength="3" maxlength="30" required>
            </div>

            <div class="grupo-campo">
                <label>Campus:</label>
                <div class="opciones-campus">
                    <label><input type="radio" name="campus" value="CCEI" required> CCEI</label>
                    <label><input type="radio" name="campus" value="CAHAD"> CAHAD</label>
                    <label><input type="radio" name="campus" value="CCSE"> CCSE</label>
                    <label><input type="radio" name="campus" value="Otros"> Otro campus UADY</label>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" autocomplete="email" maxlength="120" required>
            </div>

            <div class="grupo-campo">
                <label for="password">Contraseña (mínimo 8 caracteres):</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required>
            </div>

            <button type="submit" id="btnSiguiente">Crear cuenta</button>

        </form>
        <p id="mensaje-registro" role="status" aria-live="polite"></p>
        <p class="enlace-login">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>

    <script src="JS/preferences.js"></script>
    <script src="JS/tema.js"></script>
</body>

</html>
